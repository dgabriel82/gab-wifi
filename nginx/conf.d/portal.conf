# 80: sert à Let’s Encrypt (challenge) + redirection https
server {
  listen 80;
  server_name gab-wifi.duckdns.org;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 443: reverse proxy vers Node
server {
  listen 443 ssl http2;
  server_name gab-wifi.duckdns.org;

  ssl_certificate     /etc/letsencrypt/live/gab-wifi.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gab-wifi.duckdns.org/privkey.pem;

  # (optionnel mais recommandé)
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  # Evite les uploads énormes
  client_max_body_size 2m;

  location / {
    proxy_pass http://portal:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
