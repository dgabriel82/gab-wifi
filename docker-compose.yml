services:
  nginx:
    image: nginx:alpine
    container_name: wifi_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot
      - ./letsencrypt:/etc/letsencrypt
      - ./nginx/auth/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - portal
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: wifi_certbot
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c
    command: >
      "trap exit TERM;
       while :;
       do
         certbot renew --webroot -w /var/www/certbot --quiet;
         sleep 12h;
       done"
    restart: unless-stopped

  portal:
    build: ./portal
    container_name: wifi_portal
    env_file:
      - .env
    expose:
      - "3000"
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: wifi_db
    env_file:
      - .env
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped

